name: Publish to npm

on:
  release:
    types: [published]
  # Started by release-please.yml on the release tag (see there).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check size budgets
        run: npm run size

      # Trusted publishing (OIDC) makes npm generate a provenance attestation
      # automatically, so --provenance is not needed here.
      - name: Publish
        run: npm publish --access public
