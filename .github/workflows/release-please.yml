name: Release Please

# Keeps a release PR open with the next version and changelog (from
# conventional commits). Merging it tags the release and creates the GitHub
# release, then starts publish.yml on that tag.
#
# A release created with the default GITHUB_TOKEN does not trigger the
# `release` event in other workflows, but a workflow_dispatch does, so no
# personal access token is needed. publish.yml keeps its file name, which is
# what npm trusted publishing checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish the new release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
