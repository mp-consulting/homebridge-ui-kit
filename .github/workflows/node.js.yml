name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check dist is up to date
        run: npm run build:check

      - name: Test
        run: npm test

      - name: Type-check declarations
        run: npm run test:types

  visual:
    name: Visual and accessibility tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Build and prepare the gallery
        run: |
          npm run build
          npm run examples

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Baselines are per platform (e2e/__screenshots__/<platform>/). Missing
      # linux baselines are written instead of failing; commit them from the
      # uploaded artifact to start comparing. axe-core and keyboard checks
      # always run.
      - name: Playwright (screenshots, axe-core, keyboard)
        run: npx playwright test --update-snapshots=missing

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-screenshots
          path: e2e/__screenshots__/linux/
          if-no-files-found: ignore

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
