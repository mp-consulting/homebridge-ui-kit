name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check dist is up to date
        run: npm run build:check

      - name: Test
        run: npm test

      - name: Type-check declarations
        run: npm run test:types

      - name: Check size budgets
        run: npm run size

      - name: Check the package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0].files.map(f => f.path);
            const need = ['dist/kit.css', 'dist/kit.js', 'dist/ai.css', 'dist/kit.min.js', 'dist/kit.min.css',
              'dist/ai.min.css', 'dist/kit.mjs', 'dist/kit.d.ts', 'dist/kit.d.mts', 'dist/theme-boot.js',
              'scripts/copy-assets.js'];
            const missing = need.filter(f => !files.includes(f));
            const stray = files.filter(f => /^(src|test|e2e|examples)\//.test(f));
            if (missing.length || stray.length) { console.error({ missing, stray }); process.exit(1); }
            console.log(files.length + ' files OK');
          "

  visual:
    name: Visual and accessibility tests
    runs-on: ubuntu-latest
    # The same image the linux baselines were made with: fonts and Chromium
    # match exactly. Keep its tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Build and prepare the gallery
        run: |
          npm run build
          npm run examples

      # Baselines are per platform (e2e/__screenshots__/<platform>/). To update
      # the linux ones, run the same image locally:
      #   docker run --rm --ipc=host -v "$PWD":/work -w /work -v /work/node_modules \
      #     mcr.microsoft.com/playwright:v1.63.0-noble \
      #     bash -lc "npm ci && npm run build && npm run examples && npx playwright test --update-snapshots"
      - name: Playwright (screenshots, axe-core, keyboard)
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
